<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeekZone - Agente IA Completo</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>

    <!-- CABEÇALHO DA LOJA -->
    <div class="topo">
        <h1>🚀 GeekZone</h1>
        <!-- Botão de Alternar Tema (Dark/Light) -->
        <button id="btn-tema" class="btn-tema" onclick="alternarTema()">☀️ Mudar para Claro</button>
        <div style="font-size: 1.2rem; font-weight: bold; color: #4caf50;">🛒 R$ <span id="valor-total">0.00</span></div>
    </div>

    <section class="carrinho-itens" aria-label="Itens do carrinho"><strong>Itens no carrinho:</strong><ul id="itens-carrinho"></ul></section>

    <!-- VITRINE DE PRODUTOS -->
    <div class="vitrine">
        <div class="card">
            <img src="/img/sabre-de-luz.webp" alt="Sabre de Luz LED" class="produto-imagem">
            <h3>Sabre de Luz LED</h3>
            <div class="preco">R$ 250,00</div>
            <button class="btn-comprar" onclick="comprar(250, 'Sabre de Luz')">Comprar</button>
        </div>
        <div class="card">
            <img src="/img/goku.webp" alt="Figure Goku" class="produto-imagem">
            <h3>Action Figure Goku</h3>
            <div class="preco">R$ 150,00</div>
            <button class="btn-comprar" onclick="comprar(150, 'Goku')">Comprar</button>
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE DO CHAT -->
    <button id="btn-abrir-chat" onclick="alternarChat()" class="btn-flutuante">🤖 Fale com a IA</button>

    <!-- JANELA DO CHAT -->
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <span>🤖 Agent GeekZone</span>
            <button onclick="alternarChat()" style="background:none; border:none; color:white; cursor:pointer;">✖</button>
        </div>
       
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">Olá! Pode digitar ou usar o microfone para falar comigo! 🎤</div>
        </div>
       
        <div class="chat-input-area">
            <!-- Botão de Voz -->
            <button id="btn-mic" class="btn-mic" onclick="ouvirCliente()" title="Falar">🎤</button>
            <input type="text" id="user-input" placeholder="Digite ou fale...">
            <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
        </div>
    </div>

</body>
</html>
